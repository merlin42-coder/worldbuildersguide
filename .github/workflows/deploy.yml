env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          # Public Lovable Cloud values — safe to commit (publishable anon key only).
          VITE_SUPABASE_URL: https://zjephlkiesyzsgwtlbrv.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpqZXBobGtpZXN5enNnd3RsYnJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTQzNDMsImV4cCI6MjA5MzQ5MDM0M30.ez92zBf2awKaD7HC7ArMsvE9zUBElITTQzFW3tYtmqk
          VITE_SUPABASE_PROJECT_ID: zjephlkiesyzsgwtlbrv
        run: npm run build

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
